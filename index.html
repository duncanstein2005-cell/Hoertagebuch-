.hero img{width:92px;mix-blend-mode:screen;flex:none}
h1{font:800 1.7rem/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;margin:0}
.sub{color:#b4cde3;font-size:.9rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
input,select,button,textarea{font:inherit;font-size:16px;color:var(--ink);background:#0a1b32;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px}
input[type=checkbox]{min-height:0}
button{cursor:pointer;transition:background .12s,transform .1s}button:active{transform:scale(.98)}button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.on{background:#c0342a;border-color:#d9473b;color:#fff;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:.8rem;color:var(--mute);margin:8px 0 6px}
.hint{color:var(--mute);font-size:.85rem}
#status{margin-bottom:8px}
.bar{position:sticky;top:0;z-index:5;margin:0 -12px 10px;padding:8px 12px;background:rgba(8,22,40,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#q{width:100%;margin-bottom:8px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;flex:none;border-radius:99px;min-height:36px;padding:4px 14px;font-size:.85rem;background:transparent;color:var(--mute)}
.seg button.on{background:#1d5578;border-color:#48a8d8;color:var(--ink);font-weight:600}
#live{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.livechip{text-align:left;min-height:40px;padding:6px 12px;font-size:.88rem;background:#12294a;border-color:#1f5f8a;color:#d3e6f5;border-radius:12px}
.tag{display:inline-block;border:2px solid;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600}
.top{display:flex;gap:10px;align-items:center;cursor:pointer}
.nr{font:800 1.6rem/1 var(--disp);min-width:2.3ch;text-align:center}
.info{flex:1;min-width:0}.t{display:block;font-weight:600;overflow-wrap:anywhere}.t small{color:var(--mute);font-weight:400}
.sumline{font-size:.8rem;color:var(--mute);margin-top:2px}
.chev{color:var(--mute);padding:0 4px}
.img{width:64px;height:64px;border-radius:10px;background:#0a1b32;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#55607c;overflow:hidden;flex:none}.img img{width:100%;height:100%;object-fit:cover}
.body{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.sum{display:flex;gap:14px;align-items:center;margin-bottom:8px}.big{font:800 2.2rem/1 var(--disp);color:var(--gold)}
.stars{white-space:nowrap;letter-spacing:2px}.st{color:var(--off)}.st.on{color:var(--gold)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.badge{font-size:.75rem;color:#b4cde3;border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:#0a1b32}
.av{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:2px solid;font:800 .8rem var(--disp);letter-spacing:.04em;flex:none}
.rev{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.rtop{display:flex;align-items:center;gap:10px}.who{flex:1;min-width:0;display:flex;flex-direction:column}.who small{color:var(--mute)}
.rtext{margin:8px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.rtext.blur{filter:blur(7px);user-select:none;-webkit-user-select:none;pointer-events:none}
.spo{width:100%;margin:6px 0;background:#1c1a30;border-color:#3f3a66;color:#bdb2ee}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.act{min-height:38px;padding:4px 12px;border-radius:99px;font-size:.85rem;background:transparent}
.act.liked{border-color:#c0342a;color:#ff8f86}
.thread{margin:8px 0 0 12px;padding-left:12px;border-left:2px solid var(--line)}
.reply{display:flex;gap:8px;margin:8px 0}.reply .av{width:28px;height:28px;font-size:.65rem}.reply p{margin:2px 0 0;overflow-wrap:anywhere}
.rbox{display:flex;gap:6px;margin-top:8px}.rbox input{flex:1;min-width:0}
.form{background:#0b1d36;border:1px solid #1f5f8a;border-radius:14px;padding:12px;margin-top:14px}
.form h3{margin:0 0 6px;font:700 1.1rem var(--disp);letter-spacing:.03em}
button.sbtn,button.sbtn.on{background:none;border:none;box-shadow:none;padding:0;width:44px;height:44px;font-size:1.9rem;line-height:1;color:var(--off)}
button.sbtn.on{color:var(--gold);text-shadow:0 0 10px rgba(224,176,80,.35)}
textarea{width:100%;min-height:90px;margin:10px 0;resize:vertical}
details{margin-top:6px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:#7fc4e8}
.crow{display:flex;align-items:center;gap:10px;margin:6px 0}.crow span{flex:1;font-size:.88rem}.crow select{min-width:84px}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px}label.chk input{width:22px;height:22px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tools button{min-height:38px;padding:4px 12px;font-size:.82rem;background:transparent}
.cgrid{display:flex;gap:8px;overflow-x:auto;margin:6px 0 10px}.cgrid button{padding:0;min-height:0;width:72px;height:72px;flex:none;overflow:hidden;border-radius:10px}.cgrid img{width:100%;height:100%;object-fit:cover}
.mini{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exist button{min-height:36px;padding:4px 12px;font-size:.85rem}

  if(flt==="recent")arr.sort((a,b)=>act(b.k)-act(a.k));
  arr.forEach(it=>list.append(epCard(it)));
  if(!arr.length)list.append(el("div","hint","Keine Folgen gefunden."));
}
$("q").oninput=render;
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=b.dataset.v;if(v==="rand"){randomEp();return}flt=v;[...$("seg").children].forEach(x=>x.classList.toggle("on",x===b));render()};
function finishName(){const v=$("name").value.trim().slice(0,20);if(!v){msg("Bitte gib deinen Vornamen ein.");return}me.name=v;ensureCh();players[uid]=me;editing=false;msg("");save();render()}
$("done").onclick=finishName;
$("name").onkeydown=e=>{if(e.key==="Enter")finishName()};
$("addsp").onclick=async()=>{const v=prompt("Titel der Special-Folge:");if(v&&v.trim()){const id=Date.now().toString(36),val=v.trim().slice(0,80);try{specials[id]=val;render();await put("specials/"+id,val)}catch(e){msg("Hinzufügen nicht möglich.")}}};
$("addep").onclick=async()=>{const n=parseInt(prompt("Nummer der neuen Folge:"),10);if(!n||n<1||n>999)return;const v=prompt("Titel der Folge "+n+":");if(v&&v.trim()){const val=v.trim().slice(0,80);try{titles[n]=val;render();await put("titles/"+n,val)}catch(e){msg("Hinzufügen nicht möglich.")}}};
$("name").value=me.name||"";
render();
function start(){
  try{const c=localStorage.getItem("g3q_cache");if(c)store=JSON.parse(c)}catch(e){}
  pending.forEach(op=>{if(op.t==="put")store[op.k]=op.v;else delete store[op.k]});
  rebuild();render();
  if(!sb){msg("Offline-Modus – die Datenbank-Bibliothek konnte nicht geladen werden. Zuletzt gespeicherte Daten werden angezeigt.");return}
  load().then(subscribe);
  setInterval(load,60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
  window.addEventListener("online",()=>{msg("");load()});
}
start();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script></body></html>
